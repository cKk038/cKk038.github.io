<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9DC2DD"/>
  </marker>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#E3EFFA"/>
  </pattern>
</defs>
<style>
  /* 系统开了「减少动态效果」就整体静止 —— 不靠 JS，纯 CSS 媒体查询 */
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .fade { animation: none !important; }
    .pulse { opacity: 1 !important; }
  }
  .flow {
    stroke-dasharray: 9 11;
    animation: flowDash 1.6s linear infinite;
  }
  @keyframes flowDash {
    to { stroke-dashoffset: -20; }
  }

  .pulse rect { transition: stroke-width .3s; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { stroke: #C7DFF1; stroke-width: 1.6; }
    18%, 32% { stroke: #2E9BD6; stroke-width: 3; }
  }</style>
