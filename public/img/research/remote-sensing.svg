<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9DC2DD"/>
  </marker>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#E3EFFA"/>
  </pattern>
</defs>
<style>
  /* 系统开了「减少动态效果」就整体静止 —— 不靠 JS，纯 CSS 媒体查询 */
  @media (prefers-reduced-motion: reduce) {
    .flow, .pulse, .fade { animation: none !important; }
    .pulse { opacity: 1 !important; }
  }
  .flow {
    stroke-dasharray: 9 11;
    animation: flowDash 1.6s linear infinite;
  }
  @keyframes flowDash {
    to { stroke-dashoffset: -20; }
  }

  /* 检测框依次高亮，示意「正在逐个检出目标」。
     注意是改描边而不是改透明度：内容任何时刻都完整可见。 */
  .pulse { animation: pulseBox 2.4s ease-in-out infinite; }
  @keyframes pulseBox {
    0%, 100% { stroke: #1F7FB5; stroke-width: 3; }
    22%, 46% { stroke: #2E9BD6; stroke-width: 5.5; }
  }</style>
<rect width="1280" height="800" fill="#F6FAFE"/>
